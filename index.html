<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>🔤 Jogo de Letras</title>

<style>

body{
    font-family: Arial;
    margin:0;
    background: linear-gradient(180deg, #fef3c7, #fde68a);
    text-align:center;
}

/* TÍTULO */
header{
    padding:20px;
    font-size:30px;
    font-weight:bold;
}

/* LETRA GRANDE */
#letra{
    font-size:120px;
    margin:20px;
    color:#dc2626;
}

/* PERGUNTA */
#pergunta{
    font-size:24px;
}

/* BOTÕES */
.opcao{
    display:block;
    width:220px;
    margin:10px auto;
    padding:15px;
    font-size:20px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    color:white;
    transition:0.2s;
}

.op1{background:#3b82f6;}
.op2{background:#22c55e;}
.op3{background:#ef4444;}

.opcao:hover{
    transform:scale(1.1);
}

/* RESULTADO */
#resultado{
    margin-top:20px;
    font-size:26px;
    font-weight:bold;
}

</style>

</head>

<body>

<header>🔤 Jogo de Letras</header>

<div id="letra">A</div>

<div id="pergunta">Qual começa com A?</div>

<button class="opcao op1" onclick="verificar(0)" id="op0"></button>
<button class="opcao op2" onclick="verificar(1)" id="op1"></button>
<button class="opcao op3" onclick="verificar(2)" id="op2"></button>

<div id="resultado"></div>

<script>

// base simples de palavras
const palavras = [
    {letra:"A", correto:"🍎 Abelha", erradas:["🐶 Cachorro","🐱 Gato"]},
    {letra:"B", correto:"🍌 Banana", erradas:["🐸 Sapo","🐶 Cachorro"]},
    {letra:"C", correto:"🐱 Gato", erradas:["🍎 Maçã","🚗 Carro"]},
    {letra:"D", correto:"🦕 Dinossauro", erradas:["🐶 Cachorro","🍌 Banana"]},
    {letra:"E", correto:"🐘 Elefante", erradas:["🐱 Gato","🍎 Maçã"]}
];

let atual = {};
let respostaCorreta = 0;

// iniciar jogo automaticamente
novaRodada();

function novaRodada(){

    document.getElementById("resultado").innerText = "";

    // sorteia pergunta
    atual = palavras[Math.floor(Math.random()*palavras.length)];

    document.getElementById("letra").innerText = atual.letra;
    document.getElementById("pergunta").innerText = 
        "Qual começa com " + atual.letra + "?";

    falar("Qual começa com " + atual.letra);

    // mistura opções
    let opcoes = [atual.correto, ...atual.erradas];
    opcoes.sort(()=> Math.random()-0.5);

    respostaCorreta = opcoes.indexOf(atual.correto);

    // coloca nos botões
    for(let i=0;i<3;i++){
        document.getElementById("op"+i).innerText = opcoes[i];
    }
}

// verificar resposta
function verificar(index){

    if(index === respostaCorreta){
        document.getElementById("resultado").innerText = "✅ Muito bem!";
        falar("Muito bem");
    }else{
        document.getElementById("resultado").innerText = "❌ Tente de novo!";
        falar("Tente de novo");
    }

    setTimeout(novaRodada, 2000);
}

// voz
function falar(texto){
    let speech = new SpeechSynthesisUtterance(texto);
    speech.lang = "pt-BR";
    speech.rate = 0.9;
    speechSynthesis.speak(speech);
}

</script>

</body>
</html>
