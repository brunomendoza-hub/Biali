<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>🎮 Jogos da Liz e Bia</title>

<style>

body{
    margin:0;
    font-family: Arial;
    background:#87ceeb;
    text-align:center;
}

/* TELA */
.tela{
    display:none;
}

.ativo{
    display:block;
}

/* MENU */
#menu{
    padding-top:80px;
}

h1{
    font-size:30px;
}

/* BOTÕES */
.botao{
    display:block;
    width:250px;
    margin:15px auto;
    padding:18px;
    font-size:22px;
    border:none;
    border-radius:12px;
    cursor:pointer;
    background:#22c55e;
    color:white;
}

/* VOLTAR */
#voltar{
    margin-top:20px;
    padding:10px 20px;
}

/* LETRA */
#letra{
    font-size:120px;
    color:#065f46;
}

.opcao{
    display:block;
    width:240px;
    margin:10px auto;
    padding:15px;
    font-size:20px;
    border:none;
    border-radius:12px;
    color:white;
    cursor:pointer;
}

.op1{background:#3b82f6;}
.op2{background:#22c55e;}
.op3{background:#ef4444;}

#placar{
    font-size:22px;
    margin-top:10px;
}

footer{
    position:fixed;
    bottom:8px;
    width:100%;
    font-size:14px;
}

</style>

</head>

<body>

<!-- MENU -->
<div id="menu" class="tela ativo">
    <h1>🎮 Jogos da Liz e Bia</h1>

    <button class="botao" onclick="abrir('letras')">🔤 Letras</button>
    <button class="botao" onclick="abrir('reflexo')">⚡ Reflexo</button>
</div>

<!-- JOGO LETRAS -->
<div id="letras" class="tela">

    <h2>🔤 Letras</h2>

    <div id="letra">A</div>
    <div id="pergunta"></div>

    <button class="opcao op1" onclick="resposta(0)" id="op0"></button>
    <button class="opcao op2" onclick="resposta(1)" id="op1"></button>
    <button class="opcao op3" onclick="resposta(2)" id="op2"></button>

    <div id="placar">⭐ 0</div>

    <button id="voltar" onclick="voltar()">⬅ Voltar</button>
</div>

<!-- JOGO REFLEXO -->
<div id="reflexo" class="tela">

    <h2>⚡ Reflexo</h2>

    <button id="botao" onclick="clicou()" 
    style="width:200px;height:200px;border-radius:50%;background:red;color:white;font-size:22px;">
    ESPERE
    </button>

    <div id="status"></div>

    <button onclick="iniciar()">COMEÇAR</button>

    <button id="voltar" onclick="voltar()">⬅ Voltar</button>
</div>

<footer>desenvolvido pelo pai de Liz e Bia ❤️</footer>

<script>

/* TROCA DE TELA */
function abrir(id){
    document.querySelectorAll(".tela").forEach(t => t.classList.remove("ativo"));
    document.getElementById(id).classList.add("ativo");
}

function voltar(){
    abrir("menu");
}

/* ================= LETRAS ================= */

let palavras = [
    {letra:"A", correto:"🍎 Abelha", erradas:["🐶 Cachorro","🐱 Gato"]},
    {letra:"B", correto:"🍌 Banana", erradas:["🐸 Sapo","🐶 Cachorro"]},
    {letra:"C", correto:"🐱 Cachorro", erradas:["🍎 Maçã","🚗 Carro"]}
];

let correta;
let pontos = 0;

function nova(){

    let atual = palavras[Math.floor(Math.random()*palavras.length)];

    document.getElementById("letra").innerText = atual.letra;
    document.getElementById("pergunta").innerText = "Qual começa com " + atual.letra;

    let op = [atual.correto, ...atual.erradas];
    op.sort(()=>Math.random()-0.5);

    correta = op.indexOf(atual.correto);

    for(let i=0;i<3;i++){
        document.getElementById("op"+i).innerText = op[i];
    }
}

function resposta(i){

    if(i === correta){
        pontos++;
    }else{
        pontos = 0;
    }

    document.getElementById("placar").innerText = "⭐ " + pontos;
    nova();
}

/* ================= REFLEXO ================= */

let ativo = false;

function iniciar(){
    document.getElementById("status").innerText = "Prepare-se...";

    setTimeout(()=>{
        document.getElementById("botao").style.background = "green";
        document.getElementById("botao").innerText = "AGORA!";
        ativo = true;
    }, Math.random()*2000+1000);
}

function clicou(){

    if(ativo){
        document.getElementById("status").innerText = "🔥 Rápido!";
    }else{
        document.getElementById("status").innerText = "❌ Cedo!";
    }

}

nova();

</script>

</body>
</html>
