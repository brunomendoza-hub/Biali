<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>🟩 Letras Craft</title>

<style>

/* FUNDO */
body{
    margin:0;
    font-family: "Courier New", monospace;
    background:#87ceeb;
    text-align:center;
    transition: 0.2s;
}

/* HEADER */
header{
    padding:20px;
    font-size:30px;
    background:#4ade80;
    border-bottom:5px solid #166534;
}

/* LETRA */
#letra{
    font-size:120px;
    color:#065f46;
}

/* PERGUNTA */
#pergunta{
    font-size:22px;
}

/* BOTÕES BLOCO */
.opcao{
    display:block;
    width:260px;
    margin:12px auto;
    padding:18px;
    font-size:22px;
    border:none;
    cursor:pointer;
    color:white;

    background:#22c55e;
    border:4px solid #166534;
    box-shadow:0 6px #14532d;
    transition:0.1s;
}

.opcao:active{
    transform:translateY(4px);
    box-shadow:0 2px #14532d;
}

.op1{background:#4ade80;}
.op2{background:#38bdf8;}
.op3{background:#f97316;}

/* RESULTADO */
#resultado{
    margin-top:20px;
    font-size:28px;
    font-weight:bold;
}

/* PLACAR */
#placar{
    font-size:24px;
}

/* ANIMAÇÃO TREMOR */
.tremer{
    animation: tremer 0.3s;
}

@keyframes tremer{
    0%{transform:translateX(0);}
    25%{transform:translateX(-5px);}
    50%{transform:translateX(5px);}
    100%{transform:translateX(0);}
}

/* PARTÍCULAS */
.estrela{
    position:absolute;
    font-size:25px;
    animation: subir 1s linear forwards;
}

@keyframes subir{
    0%{opacity:1; transform:translateY(0);}
    100%{opacity:0; transform:translateY(-80px);}
}

/* RODAPÉ */
footer{
    position:fixed;
    bottom:8px;
    width:100%;
}

</style>
</head>

<body>

<header>🟩 Letras Craft</header>

<div id="letra">A</div>
<div id="pergunta"></div>

<button class="opcao op1" onclick="verificar(0)" id="op0"></button>
<button class="opcao op2" onclick="verificar(1)" id="op1"></button>
<button class="opcao op3" onclick="verificar(2)" id="op2"></button>

<div id="resultado"></div>
<div id="placar">⭐ 0</div>

<footer>desenvolvido pelo pai de Liz e Bia ❤️</footer>

<script>

/* 🔊 SOM COM CLICK (corrige problema no celular) */
function tocar(url){
    let a = new Audio(url);
    a.volume = 0.4;
    a.play();
}

/* BASE */
const palavras = [
    {letra:"A", correto:"🍎 Abelha", erradas:["🐶 Cachorro","🐱 Gato"]},
    {letra:"B", correto:"🍌 Banana", erradas:["🐸 Sapo","🐶 Cachorro"]},
    {letra:"C", correto:"🐱 Cachorro", erradas:["🍎 Maçã","🚗 Carro"]},
    {letra:"D", correto:"🦕 Dinossauro", erradas:["🐶 Cachorro","🍌 Banana"]},
];

let correta;
let pontos = 0;

/* NOVA RODADA */
function nova(){

    document.body.style.background = "#87ceeb";
    document.getElementById("resultado").innerText = "";

    let atual = palavras[Math.floor(Math.random()*palavras.length)];

    document.getElementById("letra").innerText = atual.letra;
    document.getElementById("pergunta").innerText =
        "Qual começa com " + atual.letra;

    falar("Qual começa com " + atual.letra);

    let op = [atual.correto, ...atual.erradas];
    op.sort(()=>Math.random()-0.5);

    correta = op.indexOf(atual.correto);

    for(let i=0;i<3;i++){
        document.getElementById("op"+i).innerText = op[i];
    }
}

/* PARTÍCULA */
function estrela(){
    let e = document.createElement("div");
    e.innerText = "⭐";
    e.className = "estrela";

    e.style.left = (window.innerWidth/2 - 10) + "px";
    e.style.top = "250px";

    document.body.appendChild(e);

    setTimeout(()=>e.remove(),1000);
}

/* RESPOSTA */
function verificar(i){

    document.getElementById("letra").classList.add("tremer");

    setTimeout(()=>{
        document.getElementById("letra").classList.remove("tremer");
    },200);

    if(i === correta){

        pontos++;

        document.body.style.background = "#4ade80";

        document.getElementById("resultado").innerText = "🎉 Boa!";
        tocar("https://cdn.pixabay.com/download/audio/2022/03/15/audio_3d6d8c4cb4.mp3");

        estrela(); // ⭐ efeito

        falar("Boa");

    }else{

        pontos = 0;

        document.body.style.background = "#f87171";

        document.getElementById("resultado").innerText = "❌ Ops!";
        tocar("https://cdn.pixabay.com/download/audio/2022/03/15/audio_1cc5c7c7c9.mp3");

        falar("Tente novamente");
    }

    document.getElementById("placar").innerText = "⭐ " + pontos;

    setTimeout(nova,1500);
}

/* VOZ */
function falar(txt){
    let s = new SpeechSynthesisUtterance(txt);
    s.lang = "pt-BR";
    speechSynthesis.speak(s);
}

/* START */
nova();

</script>

</body>
</html>
