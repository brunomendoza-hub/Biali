<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>🔤 Jogo das Letras</title>

<style>

body{
    font-family: Arial;
    margin:0;
    background: linear-gradient(180deg, #fde68a, #fef3c7);
    text-align:center;
}

/* TÍTULO */
header{
    padding:20px;
    font-size:32px;
    font-weight:bold;
}

/* LETRA GIGANTE */
#letra{
    font-size:130px;
    color:#dc2626;
    animation: pular 1s infinite;
}

@keyframes pular{
    0%,100%{transform:translateY(0);}
    50%{transform:translateY(-10px);}
}

/* PERGUNTA */
#pergunta{
    font-size:26px;
}

/* BOTÕES */
.opcao{
    display:block;
    width:240px;
    margin:12px auto;
    padding:18px;
    font-size:22px;
    border:none;
    border-radius:15px;
    cursor:pointer;
    color:white;
    font-weight:bold;
    transition:0.2s;
}

.op1{background:#3b82f6;}
.op2{background:#22c55e;}
.op3{background:#ef4444;}

.opcao:hover{
    transform:scale(1.1);
}

/* RESULTADO */
#resultado{
    margin-top:20px;
    font-size:28px;
    font-weight:bold;
}

/* ESTRELA */
#estrela{
    font-size:70px;
    display:none;
    animation: explodir 0.6s;
}

@keyframes explodir{
    0%{transform:scale(0);}
    100%{transform:scale(1.5);}
}

/* FOOTER */
footer{
    position: fixed;
    bottom: 10px;
    width: 100%;
    text-align: center;
    font-size: 16px;
    color: #92400e;
    font-weight: bold;
}

</style>

</head>

<body>

<header>🔤 Jogo das Letras</header>

<div id="letra">A</div>

<div id="pergunta">Qual começa com A?</div>

<button class="opcao op1" onclick="verificar(0)" id="op0"></button>
<button class="opcao op2" onclick="verificar(1)" id="op1"></button>
<button class="opcao op3" onclick="verificar(2)" id="op2"></button>

<div id="resultado"></div>
<div id="estrela">⭐</div>

<footer>desenvolvido pelo pai de Liz e Bia ❤️</footer>

<script>

// 🔊 sons
function somAcerto(){
    let audio = new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_3d6d8c4cb4.mp3");
    audio.play();
}

function somErro(){
    let audio = new Audio("https://cdn.pixabay.com/download/audio/2022/03/15/audio_1cc5c7c7c9.mp3");
    audio.play();
}

// base de palavras simples
const palavras = [
    {letra:"A", correto:"🍎 Abelha", erradas:["🐶 Cachorro","🐱 Gato"]},
    {letra:"B", correto:"🍌 Banana", erradas:["🐸 Sapo","🐶 Cachorro"]},
    {letra:"C", correto:"🐱 Cachorro", erradas:["🍎 Maçã","🚗 Carro"]},
    {letra:"D", correto:"🦕 Dinossauro", erradas:["🐶 Cachorro","🍌 Banana"]},
    {letra:"E", correto:"🐘 Elefante", erradas:["🐱 Gato","🍎 Maçã"]},
    {letra:"F", correto:"🐟 Peixe", erradas:["🐶 Cachorro","🍎 Maçã"]},
    {letra:"G", correto:"🐱 Gato", erradas:["🍌 Banana","🚗 Carro"]}
];

let atual;
let correta;

// nova rodada
function nova(){

    document.getElementById("estrela").style.display = "none";
    document.getElementById("resultado").innerText = "";

    atual = palavras[Math.floor(Math.random()*palavras.length)];

    document.getElementById("letra").innerText = atual.letra;

    document.getElementById("pergunta").innerText =
        "Qual começa com " + atual.letra + "?";

    falar("Qual começa com " + atual.letra);

    let opcoes = [atual.correto, ...atual.erradas];
    opcoes.sort(()=>Math.random()-0.5);

    correta = opcoes.indexOf(atual.correto);

    for(let i=0;i<3;i++){
        document.getElementById("op"+i).innerText = opcoes[i];
    }
}

// verificar resposta
function verificar(i){

    let estrela = document.getElementById("estrela");

    if(i === correta){
        document.getElementById("resultado").innerText = "🎉 Muito bem!";
        estrela.style.display = "block";
        somAcerto();
        falar("Muito bem");
    }else{
        document.getElementById("resultado").innerText = "❌ Tente novamente!";
        somErro();
        falar("Tente novamente");
    }

    setTimeout(nova, 2000);
}

// voz
function falar(txt){
    let s = new SpeechSynthesisUtterance(txt);
    s.lang = "pt-BR";
    speechSynthesis.speak(s);
}

// iniciar
nova();

</script>

</body>
</html>
``
